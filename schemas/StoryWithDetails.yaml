required:
  - storyId
  - storyUrl
  - storyDateTime
  - storyTitle
  - locationLabel
  - locationBoundingbox
  - locationBoundingboxArea
  - locationPoint
  - keywords
  - mainLocationRationale
properties:
  storyId:
    nullable: false
    type: integer
    format: int64
  storyUrl:
    nullable: false
    type: string
  storyDateTime:
    nullable: false
    type: string
    format: date-time
  storyTitle:
    nullable: false
    type: string
  locationLabel:
    nullable: false
    type: string
  locationBoundingbox:
    nullable: false
    type: array
    items:
      type: number
  locationBoundingboxArea:
    nullable: false
    type: number
  locationPoint:
    nullable: false
    $ref: "./GeomPoint.yaml"
  keywords:
    nullable: false
    type: array
    items:
      type: string
  mainLocationRationale:
    nullable: false
    type: string
    enum:
      - none
      - manual
      - llmEnriched
