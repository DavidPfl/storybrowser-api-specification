get:
  operationId: getStoryWithDetails
  description: ""
  tags:
    - stories
  parameters:
    - in: query
      name: keyword
      schema:
        type: string
    - in: query
      name: keywordType
      required: false
      description: >-
        Selects which keyword set the `keyword` filter is matched against.
        `original` (default) matches the raw keywords extracted from the source
        portal; `cluster` matches the curated cluster keywords assigned to
        stories. Omitting this parameter preserves the original behavior.
      schema:
        type: string
        enum:
          - original
          - cluster
        default: original
    - in: query
      name: lat
      schema:
        type: number
        format: double
    - in: query
      name: lon
      schema:
        type: number
        format: double
    - in: query
      name: radiusInMeters
      schema:
        type: number
        format: double
    - in: query
      name: startDate
      schema:
        type: string
    - in: query
      name: endDate
      schema:
        type: string
    - in: query
      name: pageNumber
      schema:
        type: integer
    - in: query
      name: pageSize
      schema:
        type: integer
    - in: query
      name: sortBy
      schema:
        type: string
    - in: query
      name: ascending
      schema:
        type: boolean
  responses:
    200:
      description: ""
      content:
        application/json:
          schema:
            $ref: "../schemas/StoryWithDetailsPaged.yaml"
