get:
  operationId: getAggregates
  description: ""
  tags:
    - stories
  parameters:
    - in: query
      name: keyword
      schema:
        type: string
    - in: query
      name: lat
      schema:
        type: number
        format: double
    - in: query
      name: lon
      schema:
        type: number
        format: double
    - in: query
      name: radiusInMeters
      schema:
        type: number
        format: double
    - in: query
      name: startDate
      schema:
        type: string
    - in: query
      name: endDate
      schema:
        type: string
    - in: query
      name: granularity
      schema:
        type: string
        enum:
          - day
          - week
          - month
    - in: query
      name: limit
      schema:
        type: integer
  responses:
    200:
      description: ""
      content:
        application/json:
          schema:
            $ref: "../schemas/AggregatesResponse.yaml"
