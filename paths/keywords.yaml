get:
  description: "get all keywords"
  operationId: getKeywords
  tags:
    - stories
  parameters:
    - in: query
      name: keywordType
      required: false
      description: >-
        Selects which keyword set to return. `original` (default) returns the
        raw keywords extracted from the source portal; `cluster` returns the
        curated cluster keywords assigned to stories. Omitting this parameter
        preserves the original behavior.
      schema:
        type: string
        enum:
          - original
          - cluster
        default: original
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../schemas/Keyword.yaml"
